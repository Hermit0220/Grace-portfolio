<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace's Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>

<body>

    <!-- ===== VIEW COUNTER ===== -->
    <div id="view-counter" class="view-counter" title="Website Views">
        <img src="eye-svgrepo-com-removebg-preview.png" alt="Views Icon" class="view-icon">
        <span id="view-count-text">--</span>
    </div>

    <!-- ===== LOGIN OVERLAY ===== -->
    <div id="login-overlay">
        <div id="login-panel">
            <div id="login-header">
                <h1 id="login-title">Welcome</h1>
                <p id="login-subtitle">Enter your credentials to continue</p>
            </div>
            <form id="login-form" autocomplete="off">
                <div class="login-field">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" placeholder="Enter username" autocomplete="off" spellcheck="false">
                </div>
                <div class="login-field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter password" autocomplete="off">
                </div>
                <p id="login-error" style="display:none;">Invalid credentials. Please try again.</p>
                <button type="submit" id="login-btn">Enter</button>
            </form>
        </div>
    </div>
    <!-- ===== END LOGIN OVERLAY ===== -->

    <div class="landing-page">
        <!-- Music Player -->
        <div id="music-player-container">
            <div class="player-controls">

                <button id="play-pause-btn" class="control-btn">
                    <img id="play-icon" src="play-button-svgrepo-com.svg" alt="Play">
                    <img id="pause-icon" src="pause-svgrepo-com.svg" alt="Pause" style="display: none;">
                </button>

            </div>
            <div class="slider-wrapper">
                <div class="custom-slider-bg"></div>
                <div class="custom-slider-fill" id="slider-fill"></div>
                <input type="range" id="audio-slider" min="0" max="100" value="0" step="0.1">
            </div>
            <div class="player-controls">
                <button id="next-track-btn" class="control-btn">
                    <img id="next-icon" src="next-svgrepo-com.svg" alt="Next">
                </button>
            </div>
            <audio id="audio-element" src="audio/Excitement.mp3"></audio>
        </div>

        <!-- Background elements -->
        <img src="Image assets/2.png" class="layer bg-paper" alt="Background Paper">
        <img src="Image assets/8.png" class="layer top-left-paper parallax" data-speed="0.05" alt="Torn Paper">
        <img src="Image assets/10.png" class="layer bottom-paper parallax" data-speed="0.03" alt="Torn Paper">

        <!-- Flowers -->
        <img src="Image assets/4.png" class="layer line-flower parallax" data-speed="-0.04" alt="Line Art Flower">
        <img src="Image assets/9.png" class="layer roses-left parallax" data-speed="0.06" alt="Pink Roses">
        <img src="Image assets/7.png" class="layer roses-right parallax" data-speed="0.08" alt="Pink Roses">

        <!-- Text and foreground -->
        <img src="Image assets/5.png" class="layer portfolio-text floating" alt="Portfolio Text">
        <img src="Image assets/3.png" class="layer graces-banner floating-delayed" alt="Grace's Banner">
        <img src="Image assets/6.png" class="layer hand-doodle parallax" data-speed="-0.07" alt="Hand Doodle">
    </div>

    <!-- Second Page: About Me & Fit Checks -->
    <section class="second-page" id="about">
        <!-- Background element -->
        <img src="Image assets/Second Page Images/Brown Red Flower Scrapbook Creative Portfolio Presentation/2.png"
            class="layer p2-bg" alt="Second Page Background">

        <!-- Interactive Photo Upload Containers have been moved inside the 4.png layer wrapper -->

        <!-- Foreground elements -->

        <img src="Image assets/Second Page Images/Brown Red Flower Scrapbook Creative Portfolio Presentation/3.png"
            class="layer p2-text floating" alt="About Me Text">
        <div class="layer p2-polaroids parallax" data-speed="-0.03">
            <div class="canvas-container">
                <!-- Interactive Photo Upload Containers positioned accurately behind frames -->
                <div class="photo-upload-container photo-1" data-slot="photo-1">
                    <input type="file" class="file-input" id="file-input-1" accept="image/*" hidden>
                    <div class="upload-content">
                        <svg class="add-icon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add Photo</span>
                    </div>
                    <img class="uploaded-img" src="" alt="Photo 1" style="display: none;">

                    <img src="remove-ui-svgrepo-com.svg" class="remove-btn" alt="Remove Photo"
                        style="display: none;">
                    <button class="polaroid-save-btn glass-btn" style="display: none;">Save</button>
                </div>
                <div class="photo-upload-container photo-2" data-slot="photo-2">
                    <input type="file" class="file-input" id="file-input-2" accept="image/*" hidden>
                    <div class="upload-content">
                        <svg class="add-icon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add Photo</span>
                    </div>
                    <img class="uploaded-img" src="" alt="Photo 2" style="display: none;">

                    <img src="remove-ui-svgrepo-com.svg" class="remove-btn" alt="Remove Photo"
                        style="display: none;">
                    <button class="polaroid-save-btn glass-btn" style="display: none;">Save</button>
                </div>
                <div class="photo-upload-container photo-3" data-slot="photo-3">
                    <input type="file" class="file-input" id="file-input-3" accept="image/*" hidden>
                    <div class="upload-content">
                        <svg class="add-icon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add Photo</span>
                    </div>
                    <img class="uploaded-img" src="" alt="Photo 3" style="display: none;">

                    <img src="remove-ui-svgrepo-com.svg" class="remove-btn" alt="Remove Photo"
                        style="display: none;">
                    <button class="polaroid-save-btn glass-btn" style="display: none;">Save</button>
                </div>
                <img src="Image assets/Second Page Images/Brown Red Flower Scrapbook Creative Portfolio Presentation/4.png"
                    class="canvas-img" alt="Fit Checks and Frames">
            </div>
        </div>

        <div class="layer p2-charm-container">
            <img src="Image assets/Second Page Images/Brown Red Flower Scrapbook Creative Portfolio Presentation/7(1).png"
                class="p2-charm floating" alt="Heart Charm">
        </div>
    </section>

    <!-- Third Page: More Fits -->
    <section class="third-page" id="more-fits">
        <!-- Background: same crumpled paper as page 2, flipped for seamless seam -->
        <img src="Image assets/Second Page Images/Brown Red Flower Scrapbook Creative Portfolio Presentation/2.png"
            class="layer p3-bg" alt="Third Page Background">

        <!-- Photo frames, doodles, cat, paper plane — all correctly positioned on 1920x1080 canvas -->
        <div class="layer p3-frames">
            <div class="canvas-container">
                <div class="photo-upload-container photo-4" data-slot="photo-4">
                    <input type="file" class="file-input" id="file-input-4" accept="image/*" hidden>
                    <div class="upload-content">
                        <svg class="add-icon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add Photo</span>
                    </div>
                    <img class="uploaded-img" src="" alt="Photo 4" style="display: none;">

                    <img src="remove-ui-svgrepo-com.svg" class="remove-btn" alt="Remove Photo"
                        style="display: none;">
                    <button class="polaroid-save-btn glass-btn" style="display: none;">Save</button>
                </div>
                <div class="photo-upload-container photo-5" data-slot="photo-5">
                    <input type="file" class="file-input" id="file-input-5" accept="image/*" hidden>
                    <div class="upload-content">
                        <svg class="add-icon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add Photo</span>
                    </div>
                    <img class="uploaded-img" src="" alt="Photo 5" style="display: none;">

                    <img src="remove-ui-svgrepo-com.svg" class="remove-btn" alt="Remove Photo"
                        style="display: none;">
                    <button class="polaroid-save-btn glass-btn" style="display: none;">Save</button>
                </div>
                <div class="photo-upload-container photo-6" data-slot="photo-6">
                    <input type="file" class="file-input" id="file-input-6" accept="image/*" hidden>
                    <div class="upload-content">
                        <svg class="add-icon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add Photo</span>
                    </div>
                    <img class="uploaded-img" src="" alt="Photo 6" style="display: none;">

                    <img src="remove-ui-svgrepo-com.svg" class="remove-btn" alt="Remove Photo"
                        style="display: none;">
                    <button class="polaroid-save-btn glass-btn" style="display: none;">Save</button>
                </div>
                <div class="photo-upload-container photo-7" data-slot="photo-7">
                    <input type="file" class="file-input" id="file-input-7" accept="image/*" hidden>
                    <div class="upload-content">
                        <svg class="add-icon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add Photo</span>
                    </div>
                    <img class="uploaded-img" src="" alt="Photo 7" style="display: none;">

                    <img src="remove-ui-svgrepo-com.svg" class="remove-btn" alt="Remove Photo"
                        style="display: none;">
                    <button class="polaroid-save-btn glass-btn" style="display: none;">Save</button>
                </div>
                <div class="photo-upload-container photo-8" data-slot="photo-8">
                    <input type="file" class="file-input" id="file-input-8" accept="image/*" hidden>
                    <div class="upload-content">
                        <svg class="add-icon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add Photo</span>
                    </div>
                    <img class="uploaded-img" src="" alt="Photo 8" style="display: none;">

                    <img src="remove-ui-svgrepo-com.svg" class="remove-btn" alt="Remove Photo"
                        style="display: none;">
                    <button class="polaroid-save-btn glass-btn" style="display: none;">Save</button>
                </div>
                <img src="Image assets/Third page boothpic/Brown Red Flower Scrapbook Creative Portfolio Presentation/Brown Red Flower Scrapbook Creative Portfolio Presentation.png"
                    class="canvas-img" alt="Photo Frames">
            </div>
        </div>

        <!-- Halftone cat — sits bottom center on canvas -->
        <img src="Image assets/Third page boothpic/Brown Red Flower Scrapbook Creative Portfolio Presentation/3.png"
            class="layer p3-cat floating" alt="Halftone Cat">

        <!-- More fits text — top-center area on canvas -->
        <img src="Image assets/Third page boothpic/Brown Red Flower Scrapbook Creative Portfolio Presentation/2.png"
            class="layer p3-title floating-delayed" alt="More Fits Text">
    </section>

    <!-- Fourth Page: Sweet Ambitions -->
    <section class="fourth-page" id="sweet-ambitions">
        <!-- Background -->
        <img src="Image assets/Second Page Images/Brown Red Flower Scrapbook Creative Portfolio Presentation/2.png"
            class="layer p4-bg" alt="Fourth Page Background">

        <div class="layer p4-frames">
            <div class="canvas-container">
                <!-- Text and torn paper inside canvas for exact 16:9 alignment -->
                <img src="Image assets/4th page/Brown Red Flower Scrapbook Creative Portfolio Presentation (3).png"
                    class="p4-text floating" alt="Sweet Ambitions Text">

                <!-- Top-left polaroid frame -->
                <div class="photo-upload-container photo-9" data-slot="photo-9">
                    <input type="file" class="file-input" id="file-input-9" accept="image/*" hidden>
                    <div class="upload-content">
                        <svg class="add-icon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add Photo</span>
                    </div>
                    <img class="uploaded-img" src="" alt="Photo 9" style="display: none;">
                    <img src="remove-ui-svgrepo-com.svg" class="remove-btn" alt="Remove Photo"
                        style="display: none;">
                    <button class="polaroid-save-btn glass-btn" style="display: none;">Save</button>
                </div>

                <!-- Bottom-right polaroid frame overlapping -->
                <div class="photo-upload-container photo-10" data-slot="photo-10">
                    <input type="file" class="file-input" id="file-input-10" accept="image/*" hidden>
                    <div class="upload-content">
                        <svg class="add-icon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add Photo</span>
                    </div>
                    <img class="uploaded-img" src="" alt="Photo 10" style="display: none;">
                    <img src="remove-ui-svgrepo-com.svg" class="remove-btn" alt="Remove Photo"
                        style="display: none;">
                    <button class="polaroid-save-btn glass-btn" style="display: none;">Save</button>
                </div>

                <!-- Frames Image (Overlaying the upload containers) -->
                <img src="Image assets/4th page/Brown Red Flower Scrapbook Creative Portfolio Presentation (2).png"
                    class="p4-frames-img" alt="Frames">

                <!-- Top overlay image (e.g. glass reflections or top borders) -->
                <img src="Image assets/4th page/Brown Red Flower Scrapbook Creative Portfolio Presentation (5).png"
                    class="p4-frames-img" style="z-index: 5;" alt="Frames Overlay">

                <!-- Editable note over the crinkled paper -->
                <div class="p4-note-wrapper" id="p4-note-wrapper">
                    <textarea
                        id="p4-note-textarea"
                        class="p4-note-textarea"
                        placeholder="Write something here..."
                        maxlength="500"
                    ></textarea>
                    <button id="p4-note-save-btn" class="p4-note-save-btn admin-only-element">Save</button>
                </div>
            </div>
        </div>
    </section>


    <!-- Fifth Page: Music Taste -->
    <section class="fifth-page" id="music-taste">

        <div class="layer p5-layer">
            <div class="canvas-container">

                <!-- Background: pink gingham -->
                <img src="Image assets/5th page/20.png" class="canvas-img p5-bg" alt="Pink Gingham Background">

                <!-- Torn newspaper left edge -->
                <img src="Image assets/5th page/21.png" class="p5-asset p5-newspaper-left" alt="Torn Newspaper Left">

                <!-- Torn newspaper bottom center -->
                <img src="Image assets/5th page/22.png" class="p5-asset p5-newspaper-bottom"
                    alt="Torn Newspaper Bottom">

                <!-- Brown paper strip — text area -->
                <img src="Image assets/5th page/23.png" class="p5-asset p5-paper-strip" alt="Brown Paper Strip">

                <!-- Music Taste title -->
                <img src="Image assets/5th page/27.png" class="p5-asset p5-title" alt="Music Taste Title">

                <!-- Discs for 4-state synchronized conveyor animation -->
                <img src="Image assets/5th page/disc-top.png" class="p5-asset p5-disc p5-disc-4" alt="Top Disc 2">
                <img src="Image assets/5th page/disc-top.png" class="p5-asset p5-disc p5-disc-3" alt="Top Disc">
                <img src="Image assets/5th page/disc-center.png" class="p5-asset p5-disc p5-disc-2"
                    alt="Center Right Disc">
                <img src="Image assets/5th page/disc-bottom.png" class="p5-asset p5-disc p5-disc-1"
                    alt="Bottom Right Disc">

                <div class="p5-text-area">
                    <!-- Song title input -->
                    <textarea id="p5-song-title" class="p5-textbox p5-textbox-title" placeholder="SONG HEADING"
                        onfocus="this.placeholder=''" onblur="this.placeholder='SONG HEADING...'" maxlength="28"
                        rows="1" spellcheck="true"></textarea>
                    <!-- Song details input -->
                    <textarea id="p5-song-details" class="p5-textbox p5-textbox-details"
                        placeholder="&#10;Write what you feel about this song...&#10;&#10;" maxlength="160" rows="5"
                        onfocus="this.placeholder = ''" onblur="this.placeholder = 'Type your text here...'"
                        spellcheck="false"></textarea>
                    <!-- Per-track save button -->
                    <button id="p5-note-save-btn" class="p5-note-save-btn admin-only-element">Save</button>
                </div>

                <!-- Error toast for page 5 -->
                <div id="p5-error-toast" class="p5-error-toast"></div>
               
                <!-- Page 5 Controls -->
                <div class="p5-controls-left">
                    <button id="p5-manage-tracks-btn" class="glass-btn admin-only-element" style="display: none;">Manage Tracks</button>
                    <button id="p5-add-btn" class="glass-btn admin-only-element">Add Track</button>
                    <input type="file" id="p5-file-input" accept="audio/*" style="display: none;">
                    <button id="p5-save-btn" class="glass-btn" style="display: none;">Save Track</button>
                </div>

                <div class="p5-controls-right">
                    <button id="p5-prev-btn" class="glass-btn icon-btn">
                        <img src="next-svgrepo-com (2).svg" alt="Previous Track" style="transform: scaleX(-1);">
                    </button>
                    <button id="p5-next-btn" class="glass-btn icon-btn">
                        <img src="next-svgrepo-com (2).svg" alt="Next Track">
                    </button>
                </div>

                <audio id="p5-audio-player" style="display: none;"></audio>
            </div>
        </div>

    </section>


    <script src="script.js"></script>
</body>

</html>

<!-- ═══════════════════════════════════════════════════════
     TRACK LIST POPUP (Manage Tracks)
════════════════════════════════════════════════════════ -->
<div id="track-list-overlay" class="track-list-overlay" style="display:none;" role="dialog" aria-modal="true" aria-label="Manage Tracks">
    <div class="track-list-popup">
        <div class="track-list-header">
            <span class="track-list-title">Manage Tracks</span>
            <button id="track-list-close" class="track-list-close" aria-label="Close">&times;</button>
        </div>
        <div id="track-list-body" class="track-list-body">
            <!-- rows injected by JS -->
        </div>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     TRACK REMOVE CONFIRMATION POPUP
════════════════════════════════════════════════════════ -->
<div id="track-confirm-overlay" class="track-confirm-overlay" style="display:none;" role="dialog" aria-modal="true" aria-label="Confirm track removal">
    <div class="track-confirm-popup">
        <div class="track-confirm-icon">
            <img src="remove-ui-svgrepo-com.svg" alt="" aria-hidden="true">
        </div>
        <p class="track-confirm-title">Remove this track?</p>
        <p class="track-confirm-name" id="track-confirm-name"></p>
        <p class="track-confirm-sub">This will permanently remove the track and its note from the website.</p>
        <div class="track-confirm-actions">
            <button id="track-confirm-cancel" class="glass-btn track-confirm-cancel-btn">Cancel</button>
            <button id="track-confirm-remove" class="glass-btn track-confirm-remove-btn">Remove</button>
        </div>
    </div>
</div>
